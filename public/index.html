
<!DOCTYPE html>
<html lang="mn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Challenger 2 Tank Arena</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#101713;color:white;font-family:Arial;overflow:hidden}
#hud{position:fixed;inset:0;pointer-events:none}
.panel{background:#101a15dd;border:1px solid #70a77b;padding:10px;border-radius:10px}
#title{position:absolute;top:12px;left:12px;font-weight:bold;color:#9cff9c}
#map{position:absolute;right:12px;top:12px;width:145px;height:145px;background:#28372d;border:2px solid #a4c59b;border-radius:8px}
#stats{position:absolute;left:12px;bottom:110px}
#controls{position:absolute;bottom:15px;left:15px;right:15px;display:flex;justify-content:space-between;pointer-events:auto}
.pad{display:grid;grid-template-columns:55px 55px 55px;gap:5px}
button{background:#344b3b;color:white;border:1px solid #9bb99b;border-radius:10px;padding:14px;font-size:17px}
button:active{background:#739b69}
#fire{background:#873c30}
#lobby{position:fixed;inset:0;background:#101713;display:flex;align-items:center;justify-content:center;z-index:5}
#lobbybox{text-align:center;background:#1b2920;padding:25px;border-radius:15px;width:85%;max-width:360px}
input{padding:12px;width:100%;margin:8px 0;border-radius:8px;border:0}
</style>
</head>
<body>

<div id="lobby">
 <div id="lobbybox">
  <h1>CHALLENGER 2</h1>
  <p>TANK ARENA</p>
  <input id="playerName" placeholder="Тоглогчийн нэр">
  <button onclick="startGame()">Тоглоом эхлүүлэх</button>
  <p>Offline Demo</p>
 </div>
</div>

<div id="hud">
 <div id="title" class="panel">CHALLENGER 2 ARENA</div>
 <canvas id="map" width="145" height="145"></canvas>
 <div id="stats" class="panel">
  <div id="name">PLAYER</div>
  HP: <span id="hp">100</span>%<br>
  AMMO: <span id="ammo">20</span><br>
  SCORE: <span id="score">0</span>
 </div>
 <div id="controls">
  <div class="pad">
   <span></span><button onclick="move(1)">▲</button><span></span>
   <button onclick="turn(-1)">◀</button>
   <button onclick="move(-1)">▼</button>
   <button onclick="turn(1)">▶</button>
  </div>
  <button id="fire" onclick="shoot()">FIRE</button>
 </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
let scene,camera,renderer,tank;
let rotation=0,ammo=20,score=0;
let running=false;

function startGame(){
 document.getElementById("name").textContent=
 document.getElementById("playerName").value||"PLAYER";
 document.getElementById("lobby").style.display="none";
 init();
}

function init(){
 if(running)return;
 running=true;
 scene=new THREE.Scene();
 scene.background=new THREE.Color(0x9eae91);
 scene.fog=new THREE.Fog(0x9eae91,50,150);

 camera=new THREE.PerspectiveCamera(65,innerWidth/innerHeight,.1,500);
 renderer=new THREE.WebGLRenderer({antialias:true});
 renderer.setSize(innerWidth,innerHeight);
 renderer.setPixelRatio(Math.min(devicePixelRatio,2));
 document.body.insertBefore(renderer.domElement,document.getElementById("hud"));

 scene.add(new THREE.HemisphereLight(0xffffff,0x43513d,2));
 let sun=new THREE.DirectionalLight(0xffffff,2);
 sun.position.set(20,40,20);
 scene.add(sun);

 let ground=new THREE.Mesh(
  new THREE.PlaneGeometry(300,300),
  new THREE.MeshStandardMaterial({color:0x66775b})
 );
 ground.rotation.x=-Math.PI/2;
 scene.add(ground);

 for(let i=0;i<35;i++){
  let rock=new THREE.Mesh(
   new THREE.BoxGeometry(2+Math.random()*5,1+Math.random()*3,2+Math.random()*5),
   new THREE.MeshStandardMaterial({color:0x555e4b})
  );
  rock.position.set(Math.random()*180-90,.5,Math.random()*180-90);
  scene.add(rock);
 }

 tank=new THREE.Group();

 let body=new THREE.Mesh(
  new THREE.BoxGeometry(3.5,1.1,5),
  new THREE.MeshStandardMaterial({color:0x526344})
 );
 body.position.y=1;
 tank.add(body);

 let turret=new THREE.Mesh(
  new THREE.BoxGeometry(2.5,.8,2.5),
  new THREE.MeshStandardMaterial({color:0x647650})
 );
 turret.position.set(0,1.8,-.2);
 tank.add(turret);

 let barrel=new THREE.Mesh(
  new THREE.CylinderGeometry(.12,.16,3.5,12),
  new THREE.MeshStandardMaterial({color:0x333b31})
 );
 barrel.rotation.x=Math.PI/2;
 barrel.position.set(0,1.9,-2.8);
 tank.add(barrel);

 for(let side of [-1,1]){
  let track=new THREE.Mesh(
   new THREE.BoxGeometry(.55,.8,5.5),
   new THREE.MeshStandardMaterial({color:0x20251f})
  );
  track.position.set(side*1.9,.65,0);
  tank.add(track);
 }

 scene.add(tank);

 for(let i=0;i<8;i++){
  let enemy=new THREE.Mesh(
   new THREE.BoxGeometry(3,1.5,4),
   new THREE.MeshStandardMaterial({color:0x873c30})
  );
  enemy.position.set(Math.random()*70-35,.8,-20-Math.random()*70);
  scene.add(enemy);
 }

 animate();
}

function move(v){
 if(!tank)return;
 tank.position.x+=Math.sin(rotation)*v*1.5;
 tank.position.z-=Math.cos(rotation)*v*1.5;
}

function turn(v){
 rotation+=v*.15;
 if(tank)tank.rotation.y=rotation;
}

function shoot(){
 if(ammo<=0)return;
 ammo--;
 document.getElementById("ammo").textContent=ammo;
}

function drawMap(){
 let c=document.getElementById("map").getContext("2d");
 c.clearRect(0,0,145,145);
 c.fillStyle="#28372d";
 c.fillRect(0,0,145,145);
 c.fillStyle="#42ff75";
 c.beginPath();
 c.arc(72,72,5,0,Math.PI*2);
 c.fill();
 c.fillStyle="#e84d4d";
 for(let i=0;i<8;i++){
  c.fillRect(20+i*13,20+(i%3)*25,5,5);
 }
}

function animate(){
 requestAnimationFrame(animate);
 if(!tank)return;

 let offset=new THREE.Vector3(
  Math.sin(rotation)*12,
  7,
  Math.cos(rotation)*12
 );
 camera.position.set(
  tank.position.x+offset.x,
  tank.position.y+offset.y,
  tank.position.z+offset.z
 );
 camera.lookAt(tank.position.x,1,tank.position.z);
 renderer.render(scene,camera);
 drawMap();
}

window.addEventListener("resize",()=>{
 if(!camera||!renderer)return;
 camera.aspect=innerWidth/innerHeight;
 camera.updateProjectionMatrix();
 renderer.setSize(innerWidth,innerHeight);
});
</script>
</body>
</html>
