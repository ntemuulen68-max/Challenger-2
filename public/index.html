
<!DOCTYPE html>
<html lang="mn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Challenger 2 Tank Arena</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="/socket.io/socket.io.js"></script>
<style>
*{box-sizing:border-box}
body{margin:0;overflow:hidden;background:#101713;color:white;font-family:Arial,sans-serif}
button,input{font:inherit}
#game{position:fixed;inset:0}
#lobby{
 position:fixed;inset:0;z-index:10;
 display:flex;align-items:center;justify-content:center;
 background:linear-gradient(135deg,#101a19ee,#07100bee);
}
.panel{
 width:min(90%,390px);padding:28px;border:1px solid #637c66;
 border-radius:18px;background:#14221eeF;
 box-shadow:0 0 45px #000a;text-align:center
}
h1{font-size:27px;letter-spacing:2px;margin:0 0 8px}
.sub{color:#a9b9aa;margin-bottom:22px}
input{
 width:100%;padding:14px;margin:7px 0;
 background:#0b1511;color:white;border:1px solid #536a57;
 border-radius:9px;outline:none
}
button{
 border:0;border-radius:9px;padding:13px 17px;
 background:#718d46;color:white;font-weight:bold;
 cursor:pointer
}
button:active{transform:scale(.96)}
.actions{display:grid;gap:9px;margin-top:12px}
.secondary{background:#34463c}
#status{font-size:12px;color:#b9cbb7;margin-top:15px}
#hud{display:none;position:fixed;inset:0;pointer-events:none}
#top{
 position:absolute;top:12px;left:12px;right:12px;
 display:flex;justify-content:space-between;align-items:flex-start
}
.box{
 background:#07110dcc;border:1px solid #73856c;
 padding:10px 13px;border-radius:10px;
 text-shadow:0 1px 3px black
}
#map{
 width:145px;height:145px;background:#18251d;
 border:2px solid #b3c49b;border-radius:10px
}
#stats{font-size:13px;line-height:1.8}
#bottom{
 position:absolute;bottom:18px;left:0;right:0;
 display:flex;justify-content:space-between;align-items:end;
 padding:0 18px
}
.controls{display:flex;gap:9px;pointer-events:auto}
.ctrl{
 width:58px;height:58px;border-radius:50%;
 background:#18271dcc;border:1px solid #9bac83;
 font-size:23px;touch-action:none
}
#fire{width:76px;height:76px;background:#9b4b2c}
#hint{
 position:absolute;top:48%;left:50%;transform:translate(-50%,-50%);
 color:#dce9d3;text-shadow:0 2px 5px black;font-size:13px
}
#loading{
 position:fixed;inset:0;z-index:20;background:#101713;
 display:flex;flex-direction:column;align-items:center;
 justify-content:center;gap:16px
}
#bar{width:230px;height:7px;background:#34443a;border-radius:9px;overflow:hidden}
#progress{height:100%;width:0;background:#9ab66b}
@media(max-width:600px){
 #map{width:112px;height:112px}
 .ctrl{width:52px;height:52px}
 #fire{width:67px;height:67px}
}
</style>
</head>
<body>

<div id="loading">
 <h1>CHALLENGER 2</h1>
 <div>LOADING ARENA...</div>
 <div id="bar"><div id="progress"></div></div>
 <div id="loadnum">0%</div>
</div>

<div id="game"></div>

<div id="lobby" style="display:none">
 <div class="panel">
  <h1>CHALLENGER 2</h1>
  <div class="sub">TANK ARENA · MULTIPLAYER</div>
  <input id="playerName" maxlength="20" placeholder="Тоглогчийн нэр">
  <button onclick="createRoom()" style="width:100%">CREATE ROOM</button>
  <input id="roomCode" maxlength="4" placeholder="Өрөөний код">
  <button class="secondary" onclick="joinRoom()" style="width:100%">JOIN ROOM</button>
  <div id="status">Серверт холбогдож байна...</div>
 </div>
</div>

<div id="hud">
 <div id="top">
  <div class="box" id="stats">
   <b>CHALLENGER 2</b><br>
   HP: <span id="hp">100</span>%<br>
   AMMO: <span id="ammo">30</span><br>
   SCORE: <span id="score">0</span><br>
   ROOM: <span id="roomLabel">----</span>
  </div>
  <canvas id="map" width="250" height="250"></canvas>
 </div>
 <div id="hint">WASD / дэлгэцийн товчлуураар танкаа удирдана</div>
 <div id="bottom">
  <div class="controls">
   <button class="ctrl" id="left">↶</button>
   <button class="ctrl" id="forward">↑</button>
   <button class="ctrl" id="back">↓</button>
   <button class="ctrl" id="right">↷</button>
  </div>
  <button class="ctrl" id="fire">●</button>
 </div>
</div>

<script>
let scene,camera,renderer,clock;
let tank,turret,barrel;
let socket=null,roomCode="",playerName="Player";
let remoteTanks=new Map();
let keys={};
let hp=100,ammo=30,score=0;
let yaw=0,speed=0;
let firing=false;
let effects=[];
let trees=[];
let started=false;
const WORLD=220;

function loading(){
 let p=0;
 const timer=setInterval(()=>{
  p+=4;
  document.getElementById("progress").style.width=p+"%";
  document.getElementById("loadnum").textContent=p+"%";
  if(p>=100){
   clearInterval(timer);
   document.getElementById("loading").style.display="none";
   document.getElementById("lobby").style.display="flex";
   init3D();
   connectServer();
  }
 },35);
}
loading();

function connectServer(){
 if(typeof io==="undefined"){
  document.getElementById("status").textContent="Socket.IO ачаалсангүй. Серверээ шалгана уу.";
  return;
 }
 socket=io();
 socket.on("connect",()=>{
  document.getElementById("status").textContent="Серверт холбогдлоо ✓";
 });
 socket.on("connect_error",()=>{
  document.getElementById("status").textContent="Сервертэй холбогдож чадсангүй";
 });
 socket.on("roomCreated",code=>{
  roomCode=String(code);
  startGame();
 });
 socket.on("joinedRoom",code=>{
  roomCode=String(code);
  startGame();
 });
 socket.on("errorMessage",msg=>{
  document.getElementById("status").textContent=msg;
 });
 socket.on("players",players=>{
  players.forEach(p=>{
   if(p.id!==socket.id) updateRemote(p);
  });
 });
 socket.on("tankUpdated",p=>updateRemote(p));
}

function createRoom(){
 if(!socket||!socket.connected){
  alert("Серверт холбогдоогүй байна");
  return;
 }
 playerName=document.getElementById("playerName").value.trim()||"Player";
 socket.emit("createRoom",playerName);
}
function joinRoom(){
 if(!socket||!socket.connected){
  alert("Серверт холбогдоогүй байна");
  return;
 }
 playerName=document.getElementById("playerName").value.trim()||"Player";
 const code=document.getElementById("roomCode").value.trim();
 if(!/^\d{1,4}$/.test(code)){
  alert("1-9999 хүртэлх өрөөний код оруулна уу");
  return;
 }
 socket.emit("joinRoom",{code,name:playerName});
}

function init3D(){
 scene=new THREE.Scene();
 scene.background=new THREE.Color(0x9bb3b6);
 scene.fog=new THREE.FogExp2(0x9bb3b6,0.0035);

 camera=new THREE.PerspectiveCamera(65,innerWidth/innerHeight,.1,600);
 renderer=new THREE.WebGLRenderer({antialias:true});
 renderer.setSize(innerWidth,innerHeight);
 renderer.setPixelRatio(Math.min(devicePixelRatio,1.7));
 renderer.shadowMap.enabled=true;
 renderer.shadowMap.type=THREE.PCFSoftShadowMap;
 renderer.outputEncoding=THREE.sRGBEncoding;
 renderer.toneMapping=THREE.ACESFilmicToneMapping;
 renderer.toneMappingExposure=1.15;
 document.getElementById("game").appendChild(renderer.domElement);

 clock=new THREE.Clock();

 const hemi=new THREE.HemisphereLight(0xc9e5ff,0x52603b,1.25);
 scene.add(hemi);

 const sun=new THREE.DirectionalLight(0xffe3b5,2.1);
 sun.position.set(-65,100,45);
 sun.castShadow=true;
 sun.shadow.mapSize.set(2048,2048);
 sun.shadow.camera.left=-130;
 sun.shadow.camera.right=130;
 sun.shadow.camera.top=130;
 sun.shadow.camera.bottom=-130;
 sun.shadow.bias=-0.0003;
 scene.add(sun);

 createGround();
 createEnvironment();
 createTank();
 createEnemies();
 animate();
}

function createGround(){
 const geo=new THREE.PlaneGeometry(WORLD*2,WORLD*2,100,100);
 geo.rotateX(-Math.PI/2);
 const pos=geo.attributes.position;
 for(let i=0;i<pos.count;i++){
  const x=pos.getX(i),z=pos.getZ(i);
  const h=Math.sin(x*.07)*.7+Math.cos(z*.06)*.6+
          Math.sin((x+z)*.025)*1.1;
  pos.setY(i,h);
 }
 geo.computeVertexNormals();

 const mat=new THREE.MeshStandardMaterial({
  color:0x65734b,roughness:1,metalness:0
 });
 const ground=new THREE.Mesh(geo,mat);
 ground.receiveShadow=true;
 scene.add(ground);

 const grid=new THREE.GridHelper(WORLD*2,80,0x60714f,0x71805b);
 grid.position.y=.05;
 grid.material.transparent=true;
 grid.material.opacity=.12;
 scene.add(grid);
}

function random(seed){
 let x=Math.sin(seed*127.1)*43758.5453;
 return x-Math.floor(x);
}

function createTree(x,z,s){
 const g=new THREE.Group();
 const trunk=new THREE.Mesh(
  new THREE.CylinderGeometry(.16*s,.25*s,2*s,7),
  new THREE.MeshStandardMaterial({color:0x59452b})
 );
 trunk.position.y=s;
 trunk.castShadow=true;
 g.add(trunk);

 for(let i=0;i<3;i++){
  const crown=new THREE.Mesh(
   new THREE.ConeGeometry((1.1-i*.12)*s,2.2*s,7),
   new THREE.MeshStandardMaterial({
    color:[0x344c2d,0x405a31,0x52683a][i],
    roughness:1
   })
  );
  crown.position.y=(2+i*.85)*s;
  crown.castShadow=true;
  g.add(crown);
 }
 g.position.set(x,0,z);
 scene.add(g);
 trees.push(g);
}

function createRock(x,z,s){
 const rock=new THREE.Mesh(
  new THREE.DodecahedronGeometry(s,1),
  new THREE.MeshStandardMaterial({color:0x77776a,roughness:1})
 );
 rock.position.set(x,s*.45,z);
 rock.rotation.set(random(x)*2,random(z)*3,random(x+z)*2);
 rock.scale.y=.65;
 rock.castShadow=true;
 rock.receiveShadow=true;
 scene.add(rock);
}

function createBuilding(x,z){
 const g=new THREE.Group();
 const wall=new THREE.Mesh(
  new THREE.BoxGeometry(10,5,9),
  new THREE.MeshStandardMaterial({color:0x77786b,roughness:.9})
 );
 wall.position.y=2.5;
 wall.castShadow=true;
 wall.receiveShadow=true;
 g.add(wall);

 const roof=new THREE.Mesh(
  new THREE.BoxGeometry(11,.8,10),
  new THREE.MeshStandardMaterial({color:0x464b45})
 );
 roof.position.y=5.3;
 roof.castShadow=true;
 g.add(roof);
 g.position.set(x,0,z);
 scene.add(g);
}

function createEnvironment(){
 for(let i=0;i<105;i++){
  let x=(random(i+3)-.5)*WORLD*1.8;
  let z=(random(i+80)-.5)*WORLD*1.8;
  if(Math.abs(x)<17&&Math.abs(z)<17)continue;
  createTree(x,z,.7+random(i+15)*.8);
 }
 for(let i=0;i<65;i++){
  let x=(random(i+300)-.5)*WORLD*1.8;
  let z=(random(i+600)-.5)*WORLD*1.8;
  createRock(x,z,.5+random(i+900)*1.5);
 }
 createBuilding(-32,-25);
 createBuilding(38,42);
 createBuilding(52,-45);
}

function material(color,rough=.65,metal=0){
 return new THREE.MeshStandardMaterial({
  color,roughness:rough,metalness:metal
 });
}

function box(parent,w,h,d,x,y,z,mat){
 const m=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),mat);
 m.position.set(x,y,z);
 m.castShadow=true;
 m.receiveShadow=true;
 parent.add(m);
 return m;
}

function createTank(color=0x596747){
 const root=new THREE.Group();
 const hull=new THREE.Group();
 root.add(hull);

 const green=material(color,.8);
 const dark=material(0x242a25,.9);
 const metal=material(0x39433a,.55,.45);
 const glass=material(0x182e31,.2,.6);

 box(hull,3.2,.85,5.2,0,1,0,green);
 box(hull,3.35,.22,5.35,0,.55,0,dark);

 // Tracks
 for(const side of [-1,1]){
  const track=box(hull,.65,1,5.6,side*1.75,.7,0,dark);
  track.rotation.z=0;
  for(let i=0;i<7;i++){
   const wheel=new THREE.Mesh(
    new THREE.CylinderGeometry(.38,.38,.18,16),
    metal
   );
   wheel.rotation.z=Math.PI/2;
   wheel.position.set(side*2.06,.55,-2.1+i*.7);
   wheel.castShadow=true;
   hull.add(wheel);
  }
  box(hull,.12,.12,5.5,side*2.1,.15,0,metal);
 }

 // Turret
 turret=new THREE.Group();
 turret.position.set(0,1.65,-.2);
 hull.add(turret);

 box(turret,2.65,.72,2.8,0,0,0,green);
 box(turret,1.8,.3,1.5,0,.48,-.1,green);
 box(turret,.65,.22,.7,0,.5,-.9,dark);

 // Main barrel
 barrel=new THREE.Group();
 barrel.position.set(0,.1,1.1);
 turret.add(barrel);

 const tube=new THREE.Mesh(
  new THREE.CylinderGeometry(.13,.18,3.3,16),
  metal
 );
 tube.rotation.x=Math.PI/2;
 tube.position.z=1.6;
 tube.castShadow=true;
 barrel.add(tube);

 const muzzle=new THREE.Mesh(
  new THREE.CylinderGeometry(.19,.19,.35,16),
  dark
 );
 muzzle.rotation.x=Math.PI/2;
 muzzle.position.z=3.2;
 barrel.add(muzzle);

 // Details
 box(turret,.65,.42,.55,-.9,.55,-.2,green);
 box(turret,.65,.42,.55,.9,.55,-.2,green);
 box(turret,.5,.18,.3,0,.75,-.8,glass);

 // Side armor plates
 for(let side of [-1,1]){
  for(let i=0;i<4;i++){
   box(hull,.12,.6,1,side*1.88,.9,-1.8+i*1.1,green);
  }
 }
 root.traverse(o=>{
  if(o.isMesh){o.castShadow=true;o.receiveShadow=true;}
 });
 return root;
}

function createPlayerTank(){
 tank=createTank(0x64764a);
 tank.position.set(0,0,0);
 scene.add(tank);
}

function createEnemies(){
 for(let i=0;i<9;i++){
  const enemy=createTank(0x713d35);
  enemy.position.set((random(i+1000)-.5)*120,0,
                     (random(i+2000)-.5)*120);
  enemy.rotation.y=random(i+3000)*Math.PI*2;
  scene.add(enemy);
 }
}

function updateRemote(p){
 if(!p||!p.id)return;
 let obj=remoteTanks.get(p.id);
 if(!obj){
  obj=createTank(0x426b83);
  scene.add(obj);
  remoteTanks.set(p.id,obj);
 }
 obj.position.set(p.x||0,0,p.z||0);
 obj.rotation.y=p.rotation||0;
}

function startGame(){
 document.getElementById("lobby").style.display="none";
 document.getElementById("hud").style.display="block";
 document.getElementById("roomLabel").textContent=roomCode;
 createPlayerTank();
 started=true;
}

function moveTank(dt){
 if(!started||!tank)return;
 const turnSpeed=1.7;
 if(keys.left||keys.a)tank.rotation.y+=turnSpeed*dt;
 if(keys.right||keys.d)tank.rotation.y-=turnSpeed*dt;

 let direction=0;
 if(keys.forward||keys.w)direction=1;
 if(keys.back||keys.s)direction=-1;

 const v=direction*9*dt;
 tank.position.x+=Math.sin(tank.rotation.y)*v;
 tank.position.z+=Math.cos(tank.rotation.y)*v;
 tank.position.x=THREE.MathUtils.clamp(tank.position.x,-WORLD+5,WORLD-5);
 tank.position.z=THREE.MathUtils.clamp(tank.position.z,-WORLD+5,WORLD-5);

 if(socket&&socket.connected&&roomCode){
  socket.emit("tankMove",{
   x:tank.position.x,
   z:tank.position.z,
   rotation:tank.rotation.y
  });
 }
}

function shoot(){
 if(!started||ammo<=0)return;
 ammo--;
 document.getElementById("ammo").textContent=ammo;

 const flash=new THREE.PointLight(0xffbd65,5,12);
 flash.position.set(0,0,3.7);
 barrel.add(flash);
 setTimeout(()=>barrel.remove(flash),90);

 const glow=new THREE.Mesh(
  new THREE.SphereGeometry(.22,10,10),
  new THREE.MeshBasicMaterial({color:0xffc36a})
 );
 const worldPos=new THREE.Vector3();
 barrel.getWorldPosition(worldPos);
 glow.position.copy(worldPos);
 scene.add(glow);

 const direction=new THREE.Vector3(0,0,1)
  .applyQuaternion(tank.quaternion);
 effects.push({mesh:glow,dir:direction,life:1.5});
}

function updateEffects(dt){
 for(let i=effects.length-1;i>=0;i--){
  const e=effects[i];
  e.mesh.position.addScaledVector(e.dir,45*dt);
  e.life-=dt;
  if(e.life<=0){
   scene.remove(e.mesh);
   e.mesh.geometry.dispose();
   effects.splice(i,1);
  }
 }
}

function updateCamera(){
 if(!tank)return;
 const offset=new THREE.Vector3(0,7,-12);
 offset.applyQuaternion(tank.quaternion);
 const target=tank.position.clone().add(offset);
 camera.position.lerp(target,.09);
 const look=tank.position.clone();
 look.y+=2.2;
 camera.lookAt(look);
}

function updateMap(){
 const c=document.getElementById("map");
 const ctx=c.getContext("2d");
 ctx.fillStyle="#334a34";
 ctx.fillRect(0,0,250,250);

 for(const tree of trees){
  const x=125+tree.position.x*.48;
  const y=125+tree.position.z*.48;
  ctx.fillStyle="#1d3925";
  ctx.fillRect(x,y,3,3);
 }
 if(tank){
  ctx.save();
  ctx.translate(125+tank.position.x*.48,125+tank.position.z*.48);
  ctx.rotate(-tank.rotation.y);
  ctx.fillStyle="#8dff72";
  ctx.beginPath();
  ctx.moveTo(0,7);ctx.lineTo(-6,-6);ctx.lineTo(6,-6);
  ctx.closePath();ctx.fill();
  ctx.restore();
 }
 remoteTanks.forEach(t=>{
  ctx.fillStyle="#5bbaff";
  ctx.beginPath();
  ctx.arc(125+t.position.x*.48,125+t.position.z*.48,4,0,Math.PI*2);
  ctx.fill();
 });
}

function animate(){
 requestAnimationFrame(animate);
 const dt=Math.min(clock.getDelta(),.05);

 if(started){
  moveTank(dt);
  updateCamera();
  updateEffects(dt);
  updateMap();
 }
 renderer.render(scene,camera);
}

function bindButton(id,key){
 const el=document.getElementById(id);
 el.addEventListener("pointerdown",e=>{
  e.preventDefault();keys[key]=true;
 });
 ["pointerup","pointerleave","pointercancel"].forEach(ev=>{
  el.addEventListener(ev,()=>keys[key]=false);
 });
}
bindButton("forward","forward");
bindButton("back","back");
bindButton("left","left");
bindButton("right","right");

document.getElementById("fire").addEventListener("pointerdown",e=>{
 e.preventDefault();shoot();
});

window.addEventListener("keydown",e=>{
 const k=e.key.toLowerCase();
 if(k==="w")keys.w=true;
 if(k==="s")keys.s=true;
 if(k==="a")keys.a=true;
 if(k==="d")keys.d=true;
 if(k===" ")shoot();
});
window.addEventListener("keyup",e=>{
 const k=e.key.toLowerCase();
 if(k==="w")keys.w=false;
 if(k==="s")keys.s=false;
 if(k==="a")keys.a=false;
 if(k==="d")keys.d=false;
});

window.addEventListener("resize",()=>{
 if(!camera||!renderer)return;
 camera.aspect=innerWidth/innerHeight;
 camera.updateProjectionMatrix();
 renderer.setSize(innerWidth,innerHeight);
});
</script>
</body>
</html>
